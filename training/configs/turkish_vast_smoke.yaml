# Check with `python -m scripts.vast_preflight <this config>` before a long run.
model_config: pocket_tts/config/english_2026-04_24l.yaml
model_overrides:
  flow_lm.lookup_table.tokenizer: sentencepiece
  flow_lm.lookup_table.tokenizer_path: data/tr/v1/tokenizer.model
start_from_pretrained: true
reset_text_embedding: true
data:
  train_jsonl: data/tr/v1/train_aligned.jsonl
  valid_jsonl: data/tr/v1/valid_aligned.jsonl
  max_duration_sec: 10.0
  max_voice_prompt_sec: 2.0
  loader_procs: 1
  num_bucket_batches: 1
  precompute: false
flow:
  type: lsd
  kwargs: {}
flow_batch_multiplier: 4
eos_loss_weight: 0.1
text_dropout: 0.2
voice_dropout: 0.2
optim:
  lr: 2e-4
  schedule: constant
  warmup_steps: 1000
run_dir: runs/turkish_vast_smoke
batch_size: 4
grad_accum_steps: 16
compile: false
max_steps: 100
stats_ema_steps: 1000
ema_decay: 0.999
log_freq: 10
valid_freq: 50
num_valid_batches: 5
ckpt_freq: 50
num_ckpt_keep: 2
sample_freq: 100
sample_cfg_coef: 2.0
sample_sentences:
- Merhaba, bugün Türkçe konuşmayı öğreniyoruz.
- İstanbul ile Iğdır arasında uzun bir yol var.
